naftiko: 1.0.0-alpha2
info:
  label: Tropic API — Users
  description: 'Tropic API — Users. 2 operations. Lead operation: List Users. Self-contained Naftiko capability covering one
    Tropic business surface.'
  tags:
  - Tropic
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TROPIC_API_KEY: TROPIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: tropic-users
    baseUri: https://api.tropicapp.io/v1
    description: Tropic API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
    - name: users-id
      path: /users/{id}
      operations:
      - name: getuser
        method: GET
        description: Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TROPIC_API_KEY}}'
  exposes:
  - type: rest
    namespace: tropic-users-rest
    port: 8080
    description: REST adapter for Tropic API — Users. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List Users
        call: tropic-users.listusers
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{id}
      name: users-id
      description: REST surface for users-id.
      operations:
      - method: GET
        name: getuser
        description: Get User
        call: tropic-users.getuser
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tropic-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tropic API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-users
      description: List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tropic-users.listusers
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tropic-users.getuser
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
